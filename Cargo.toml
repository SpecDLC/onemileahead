[workspace]
resolver = "2"
members = ["crates/oma-core", "crates/oma-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
